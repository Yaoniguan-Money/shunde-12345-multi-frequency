name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_DB: shunde
          POSTGRES_USER: shunde
          POSTGRES_PASSWORD: shunde
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shunde -d shunde"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SHUNDE_DATABASE_URL: postgresql+asyncpg://shunde:shunde@127.0.0.1:5432/shunde
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: git ls-files --error-unmatch backend/app/infrastructure/db/models/base.py
      - name: Validate lockfile
        run: uv lock --check
      - name: Sync Python dependencies (mirror, then official fallback)
        shell: bash
        run: |
          set -euo pipefail
          if uv sync --locked; then
            exit 0
          fi
          echo "Configured mirror was unavailable; retrying the locked dependency set from PyPI."
          uv sync --frozen --default-index https://pypi.org/simple
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright backend
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test --run
      - run: pnpm build
